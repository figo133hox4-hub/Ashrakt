<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>Happy Birthday Ashrakt</title><style>body{background:linear-gradient(#ffc0cb,#ffb6c1);text-align:center;font-family:Cairo;color:#d6336c}.container{background:rgba(255,255,255,0.3);padding:20px;border-radius:20px;max-width:400px;margin:30px auto}.hidden{display:none}button{background:#ff4d88;color:white;border:none;padding:12px 25px;border-radius:20px;font-size:16px}input{padding:10px;border-radius:10px;border:none;width:80%}.meaning{background:rgba(255,255,255,0.5);padding:15px;border-radius:15px;margin:10px;text-align:right;border-right:4px solid #ff4d88}</style></head><body><div id="login" class="container"><h2>Happy Birthday 🎂</h2><p>password</p><input id="pass" type="password" placeholder="11-09-2005"><br><br><button onclick="if(pass.value=='11-09-2005'){login.classList.add('hidden');main.classList.remove('hidden');}else{alert('الباسورد غلط 💔')}">دخول</button></div><div id="main" class="container hidden"><h2>love you 💕</h2><h3>الوقت من يوم اعترافي</h3><p>08-02-2025</p><h2>💖 أشرقت 💖</h2><div class="meaning"><b>أ : أماني</b><br>انتي الأمان اللي كنت بدور عليه</div><div class="meaning"><b>ش : شمس</b><br>ضحكتك بتنور يومي</div><div class="meaning"><b>ر : راحة</b><br>معاكي قلبي بيرتاح</div><div class="meaning"><b>ق : قلبي</b><br>انتي ساكنة فيه</div><div class="meaning"><b>ت : توأم</b><br>انتي توأم روحي</div><h3>في حاجة مهمة 💕</h3><button onclick="alert('كي سي رانا بيار - بحبك')">دوسي هنا</button></div></body></html>
